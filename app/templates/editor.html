{% extends "base.html" %}
{% block content %}

<div class="container-fluid table-responsive p-lg-5">
    <!-- Channel Filters -->
    <div class="card bg-dark text-light my-3">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <!-- Active filter -->
                <div class="col-md-3 col-sm-6">
                    <label for="filter-active" class="form-label">Aktive / Inaktive Channels</label>
                    <select id="filter-active" class="form-select form-select-sm">
                        <option value="all" selected>Alle</option>
                        <option value="active">Nur aktive</option>
                        <option value="inactive">Nur inaktive</option>
                    </select>
                </div>

                <!-- Portal filter -->
                <div class="col-md-4 col-sm-6">
                    <label class="form-label">Portale</label>
                    <div class="dropdown w-100">
                        <button class="btn btn-sm btn-outline-light dropdown-toggle w-100 text-start" type="button" data-bs-toggle="dropdown">
                            Portal Filter
                        </button>
                        <div class="dropdown-menu p-2 w-100" id="portal-filter-menu" style="max-height: 300px; overflow-y: auto;">
                            <!-- Checkboxen werden dynamisch befüllt -->
                        </div>
                    </div>
                    <small class="text-muted">Erste Zeile: Alle Portale.</small>
                </div>

                <!-- Genre filter -->
                <div class="col-md-4 col-sm-6">
                    <label class="form-label">Genres</label>
                    <div class="dropdown w-100">
                        <button class="btn btn-sm btn-outline-light dropdown-toggle w-100 text-start" type="button" data-bs-toggle="dropdown">
                            Genre Filter
                        </button>
                        <div class="dropdown-menu p-2 w-100" id="genre-filter-menu" style="max-height: 300px; overflow-y: auto;">
                            <!-- Checkboxen werden dynamisch befüllt -->
                        </div>
                    </div>
                    <small class="text-muted">Mehrere Genres wählbar.</small>
                </div>

                <!-- Apply button -->
                <div class="col-md-1 col-sm-6 text-end">
                    <button type="button" class="btn btn-primary btn-sm mt-3" onclick="applyChannelFilters()">
                        Process
                    </button>
                </div>
            </div>
        </div>
    </div>



    <table id="table" class="table table-striped table-dark nowrap" width="100%">
        <!-- Add a checkbox to toggle to regex search -->
        <div class="row row-cols-auto mb-2 text-light justify-content-end">
            <span class="col">Use Regex Search:</span>
            <div class="form-check form-switch col">
                <input type="checkbox" class="checkbox form-check-input" id="regexCheckbox" onchange="toggleRegexSearch()">
            </div>
        </div>
    
        <thead>
            <tr>
                <th>
                    <div class="form-check">
                        <input type="checkbox" class="checkbox form-check-input" onchange="editAll(this)">
                    </div>
                </th>
                <th>Play</th>
                <th>Name</th>
                <th>Genre</th>
                <th>Number</th>
                <th>EPG ID</th>
                <th>Fallback For</th>
                <th>Portal</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <form action="/editor/save" method="post" id="save edits" hidden>
        <input type="text" id="enabledEdits" name="enabledEdits" value="">
        <input type="text" id="numberEdits" name="numberEdits" value="">
        <input type="text" id="nameEdits" name="nameEdits" value="">
        <input type="text" id="genreEdits" name="genreEdits" value="">
        <input type="text" id="epgEdits" name="epgEdits" value="">
        <input type="text" id="fallbackEdits" name="fallbackEdits" value="">
    </form>

    <form action="/editor/reset" method="post" id="reset" hidden>
    </form>

    <!-- Video Modal -->
    <div class="modal fade" id="videoModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="channelLabel">Channel</h5>
                </div>
                <div class="modal-body">
                    <video width="100%" id="player" controls autoplay>
                        <source src="" type="video/mp4">
                        Your browser does not support HTML video.
                    </video>
                </div>
            </div>
        </div>
    </div>

</div>

<script>

    // Filter-Optionen (Portale/Genres) aus Tabellendaten aufbauen
    
    // Filter-Optionen (Portale/Genres) aus Tabellendaten aufbauen
    function rebuildFilterOptions() {
        var table = $('#table').DataTable();
        var portalMenu = $('#portal-filter-menu');
        var genreMenu = $('#genre-filter-menu');

        if (!portalMenu.length || !genreMenu.length) {
            return;
        }

        portalMenu.empty();
        genreMenu.empty();

        // Erste Zeile: Alle Portale
        var portalAllItem = $(
            '<div class="form-check">' +
                '<input class="form-check-input" type="checkbox" id="portal-filter-all" data-all="1" checked>' +
                '<label class="form-check-label" for="portal-filter-all">Alle Portale</label>' +
            '</div>'
        );
        portalMenu.append(portalAllItem);

        // Erste Zeile: Alle Genres
        var genreAllItem = $(
            '<div class="form-check">' +
                '<input class="form-check-input" type="checkbox" id="genre-filter-all" data-all="1" checked>' +
                '<label class="form-check-label" for="genre-filter-all">Alle Genres</label>' +
            '</div>'
        );
        genreMenu.append(genreAllItem);

        var portals = new Set();
        var genres = new Set();

        table.rows().every(function () {
            var row = this.data();
            if (!row) return;
            if (row.portalName) {
                portals.add(row.portalName);
            }
            if (row.genre) {
                genres.add(row.genre);
            }
        });

        Array.from(portals).sort().forEach(function (p) {
            var raw = p || '';
            var norm = raw.toString().trim().toLowerCase();
            var id = 'portal-filter-' + norm.replace(/[^a-z0-9_-]/g, '_');
            var item = $(
                '<div class="form-check">' +
                    '<input class="form-check-input portal-filter-item" type="checkbox" id="' + id + '" data-value="' + norm + '" checked>' +
                    '<label class="form-check-label" for="' + id + '">' + raw + '</label>' +
                '</div>'
            );
            portalMenu.append(item);
        });

        Array.from(genres).sort().forEach(function (g) {
            var raw = g || '';
            var norm = raw.toString().trim().toLowerCase();
            var id = 'genre-filter-' + norm.replace(/[^a-z0-9_-]/g, '_');
            var item = $(
                '<div class="form-check">' +
                    '<input class="form-check-input genre-filter-item" type="checkbox" id="' + id + '" data-value="' + norm + '" checked>' +
                    '<label class="form-check-label" for="' + id + '">' + raw + '</label>' +
                '</div>'
            );
            genreMenu.append(item);
        });

        // "Alle"-Checkboxen: toggeln alle anderen in ihrem Menü
        $('#portal-filter-all').off('change').on('change', function () {
            var checked = $(this).is(':checked');
            portalMenu.find('.portal-filter-item').prop('checked', checked);
        });
        $('#genre-filter-all').off('change').on('change', function () {
            var checked = $(this).is(':checked');
            genreMenu.find('.genre-filter-item').prop('checked', checked);
        });
    }



    // Filter nur anwenden, wenn der Nutzer auf "Process" klickt
    
    function applyChannelFilters() {
        var table = $('#table').DataTable();

        // Active filter
        var activeMode = $('#filter-active').val() || 'all';

        // Portale
        var portalMenu = $('#portal-filter-menu');
        var portalItems = portalMenu.find('.portal-filter-item');
        var portalSelected = [];
        portalItems.each(function () {
            if ($(this).is(':checked')) {
                var v = ($(this).data('value') || '').toString().trim().toLowerCase();
                if (v) portalSelected.push(v);
            }
        });
        var portalAll = $('#portal-filter-all').is(':checked') || portalSelected.length === 0;

        // Genres
        var genreMenu = $('#genre-filter-menu');
        var genreItems = genreMenu.find('.genre-filter-item');
        var genreSelected = [];
        genreItems.each(function () {
            if ($(this).is(':checked')) {
                var v = ($(this).data('value') || '').toString().trim().toLowerCase();
                if (v) genreSelected.push(v);
            }
        });
        var genreAll = $('#genre-filter-all').is(':checked') || genreSelected.length === 0;

        // Auf alle Zeilen anwenden
        table.rows().every(function () {
            var data = this.data();
            if (!data) {
                this.visible(true);
                return;
            }

            var enabled = !!data.enabled;
            var portalName = (data.portalName || data.portal || '').toString().trim().toLowerCase();
            var genre = (data.genre || '').toString().trim().toLowerCase();

            var portalOk = portalAll || portalSelected.indexOf(portalName) !== -1;
            var genreOk = genreAll || genreSelected.indexOf(genre) !== -1;

            var activeOk = true;
            if (activeMode === 'active' && !enabled) activeOk = false;
            if (activeMode === 'inactive' && enabled) activeOk = false;

            var visible = portalOk && genreOk && activeOk;
            this.visible(visible);
        });

        // Neu zeichnen, ohne Paging zu resetten
        table.draw(false);
    }


    var enabledEdits = [];
    var numberEdits = [];
    var nameEdits = [];
    var genreEdits = [];
    var epgEdits = [];
    var fallbackEdits = [];

    function editAll(ele) {
        var checkboxes = document.getElementById('table').getElementsByClassName('checkbox');
        var enable = ele.checked;
        for (var i = 0, n = checkboxes.length; i < n; i++) {
            // Skip edit all checkbox i=0
            if (i != 0) {
                checkboxes[i].checked = enable;
                checkboxes[i].onchange();
            }
        }
    }

    function editEnabled(ele) {
        var p = ele.getAttribute('data-portal');
        var i = ele.getAttribute('data-channelId');
        var c = ele.checked;
        var j = { "portal": p, "channel id": i, "enabled": c };
        enabledEdits.push(j);
    }

    function editCustomNumber(ele) {
        var p = ele.getAttribute('data-portal');
        var i = ele.getAttribute('data-channelId');
        var c = ele.value;
        var j = { "portal": p, "channel id": i, "custom number": c };
        numberEdits.push(j);
    }

    function editCustomName(ele) {
        var p = ele.getAttribute('data-portal');
        var i = ele.getAttribute('data-channelId');
        var c = ele.value;
        var j = { "portal": p, "channel id": i, "custom name": c };
        nameEdits.push(j);
    }

    function editCustomGenre(ele) {
        var p = ele.getAttribute('data-portal');
        var i = ele.getAttribute('data-channelId');
        var c = ele.value;
        var j = { "portal": p, "channel id": i, "custom genre": c };
        genreEdits.push(j);
    }

    function editCustomEpgId(ele) {
        var p = ele.getAttribute('data-portal');
        var i = ele.getAttribute('data-channelId');
        var c = ele.value;
        var j = { "portal": p, "channel id": i, "custom epg id": c };
        epgEdits.push(j);
    }

    function editFallback(ele) {
        var p = ele.getAttribute('data-portal');
        var i = ele.getAttribute('data-channelId');
        var c = ele.value;
        var j = { "portal": p, "channel id": i, "channel name": c };
        fallbackEdits.push(j);
    }

    function save() {
        document.getElementById("enabledEdits").value = JSON.stringify(enabledEdits);
        document.getElementById("numberEdits").value = JSON.stringify(numberEdits);
        document.getElementById("nameEdits").value = JSON.stringify(nameEdits);
        document.getElementById("genreEdits").value = JSON.stringify(genreEdits);
        document.getElementById("epgEdits").value = JSON.stringify(epgEdits);
        document.getElementById("fallbackEdits").value = JSON.stringify(fallbackEdits);
        document.getElementById("save edits").submit();
    }

    var player = document.getElementById("player")
    var title = document.getElementById("channelLabel")
    player.volume = 0.25
    function selectChannel(ele) {
        link = ele.getAttribute('data-link');
        player.src = link;
        channel = ele.getAttribute('data-customChannelName');
        if (channel == "") {
            channel = ele.getAttribute('data-channelName');
        }
        title.innerHTML = channel
    }

    $('#videoModal').on('hidden.bs.modal', function () {
        player.src = "";
    })

    /* Create an array with the values of all the checkboxes in a column */
    $.fn.dataTable.ext.order['dom-checkbox'] = function (settings, col) {
        return this.api().column(col, { order: 'index' }).nodes().map(function (td, i) {
            return $('input', td).prop('checked') ? '1' : '0';
        });
    };

    /* Create an array with the values of all the input boxes in a column, parsed as numbers */
    $.fn.dataTable.ext.order['dom-text-numeric'] = function (settings, col) {
        return this.api().column(col, { order: 'index' }).nodes().map(function (td, i) {
            var val = $('input', td).val();
            return val === '' ? $('input', td).attr('placeholder') : val * 1;
        });
    };

    /* Create an array with the values of all the text boxes in a column */
    $.fn.dataTable.ext.order['dom-text'] = function (settings, col) {
        return this.api().column(col, { order: 'index' }).nodes().map(function (td, i) {
            var val = $('input', td).val();
            return val === '' ? $('input', td).attr('placeholder') : val;
        });
    };

    $(document).ready(function () {
        let dataTable = $('#table').DataTable({
            dom: "<'row m-1'<'col-auto'B><'col-auto ms-auto'f><'col-auto'l>>" +
                "<'row'<'col-12'tr>>" +
                "<'row mb-1 mb-lg-0'<'col-auto text-light'i><'col-auto ms-auto'p>>",
            orderFixed: [0, 'des'],
            order: [[0, 'des'], [2, 'asc']],
            pageLength: 25,
            stateSave: true,
            lengthMenu: [[25, 50, 100, 250, 500, 1000, -1], [25, 50, 100, 250, 500, 1000, "All"]],
            columnDefs: [
                { targets: [0, 1], width: "0%" },
                { targets: 0, className: "align-middle", orderable: false, searchable: false, orderDataType: "dom-checkbox" },
                { targets: 1, className: "align-middle", orderable: false, searchable: false },
                { targets: 2, className: "align-middle", orderDataType: "dom-text", type: 'string' },
                { targets: 3, className: "align-middle", orderDataType: "dom-text", type: 'string' },
                { targets: 4, className: "align-middle", orderDataType: "dom-text-numeric" },
                { targets: 5, className: "align-middle", orderDataType: "dom-text", type: 'string', searchable: false },
                { targets: 6, className: "align-middle", orderDataType: "dom-text", type: 'string', searchable: false },
                { targets: 7, className: "align-middle" },
                // Add render functions to text based columns
                {
                    targets: [2, 3, 5, 6], 
                    render: function (data, type, row) {
                        if (type === 'filter') {
                            // Filter function ignores string if it contains '&' character
                            return data.replaceAll('&amp;', 'and').replaceAll('&', 'and');
                        }
                        return data;
                    }
                },
            ],
            initComplete: function(settings, json) {
                rebuildFilterOptions();
            },
            language: {
                search: "",
                searchPlaceholder: 'Filter',
                lengthMenu: "_MENU_",
            },
            buttons: {
                buttons: [
                    {
                        text: '<i class="fa fa-save"></i> Save',
                        titleAttr: 'Save',
                        className: "btn btn-success",
                        action: function () {
                            save();
                        }
                    },
                    {
                        text: '<i class="fa fa-undo"></i> Reset',
                        titleAttr: 'Reset',
                        className: "btn btn-danger",
                        action: function () {
                            if (confirm("Confirm Reset\nThis will clear all edits!") == true) {
                                document.getElementById('reset').submit();
                            }
                        }
                    },
                    {
                        extend: 'searchBuilder',
                    },
                ],
            },
            ajax: {
                "url": "{{ url_for('editor_data') }}",
                "dataType": "json",
                "dataSrc": "data",
                "contentType": "application/json"
            },
            columns: [
                {
                    data: "enabled",
                    render: function (data, type, row, meta) {
                        let r = '<div \
                                class="form-check">\
                                <input \
                                type="checkbox" \
                                class="checkbox form-check-input" \
                                onchange="editEnabled(this)" \
                                data-portal="' + row.portal + '" \
                                data-channelId="' + row.channelId + '"'
                        if (data == true) {
                            r = r + ' checked';
                        }
                        r = r + '></div>'
                        return r
                    }
                },
                {
                    data: "link",
                    render: function (data, type, row, meta) {
                        return '<button \
                            class="btn btn-success btn-block" \
                            title="Play" \
                            data-bs-toggle="modal" \
                            data-bs-target="#videoModal" \
                            onclick="selectChannel(this)" \
                            data-channelName="' + row.channelName + '" \
                            data-customChannelName="' + row.customChannelName + '" \
                            data-link="' + row.link + '">\
                            <i class="fa fa-play"></i>\
                        </button>'
                    }
                },
                {
                    data: "channelName",
                    render: function (data, type, row, meta) {
                        data = '<input \
                                    type="text" \
                                    class="form-control" \
                                    style="min-width: 200px;" \
                                    onchange="editCustomName(this)" \
                                    data-portal="' + row.portal + '" \
                                    data-channelId="' + row.channelId + '" \
                                    placeholder="' + row.channelName + '" \
                                    title="' + row.channelName + '" \
                                    value="' + row.customChannelName +
                                '">'
                        // Filter function ignores string if it contains '&' character
                        if (type === 'filter') {
                            // Replace html text
                            return data.replaceAll('&amp;', 'and').replaceAll('&', 'and');
                        }
                        return data;
                    },
                },
                {
                    data: "genre",
                    render: function (data, type, row, meta) {
                        data = '<input \
                                    type="text" \
                                    class="form-control" \
                                    style="min-width: 200px;" \
                                    onchange="editCustomGenre(this)" \
                                    data-portal="' + row.portal + '" \
                                    data-channelId="' + row.channelId + '" \
                                    placeholder="' + row.genre + '" \
                                    title="' + row.genre + '" \
                                    value="' + row.customGenre +
                                '">'
                        // Filter function ignores string if it contains '&' character
                        if (type === 'filter') {
                            // Replace html text
                            return data.replaceAll('&amp;', 'and').replaceAll('&', 'and');
                        }
                        return data;
                    },
                },
                {
                    data: "channelNumber",
                    render: function (data, type, row, meta) {
                        return '<input \
                                type="test" \
                                class="form-control" \
                                style="min-width: 100px;" \
                                onchange="editCustomNumber(this)" \
                                data-portal="' + row.portal + '" \
                                data-channelId="' + row.channelId + '" \
                                placeholder="' + row.channelNumber + '" \
                                title="' + row.channelNumber + '" \
                                value="' + row.customChannelNumber +
                            '">'
                    },
                },
                {
                    data: "channelId",
                    render: function (data, type, row, meta) {
                        return '<input \
                                type="text" \
                                class="form-control" \
                                style="min-width: 200px;" \
                                onchange="editCustomEpgId(this)" \
                                data-portal="' + row.portal + '" \
                                data-channelId="' + row.channelId + '" \
                                placeholder="' + row.portal + row.channelId + '" \
                                title="' + row.portal + row.channelId + '" \
                                value="' + row.customEpgId +
                            '">'
                    },
                },
                {
                    data: "fallbackChannel",
                    render: function (data, type, row, meta) {
                        return '<input \
                                type="text" \
                                class="form-control" \
                                style="min-width: 200px;" \
                                onchange="editFallback(this)" \
                                data-portal="' + row.portal + '" \
                                data-channelId="' + row.channelId + '" \
                                value="' + row.fallbackChannel +
                            '">'
                    }
                },
                { data: "portalName" },
            ],
        });

        var isRegexEnabled = dataTable.settings()[0].oPreviousSearch.bRegex;

        // Set Checkbox state based on regex status
        $('#regexCheckbox').prop('checked', isRegexEnabled);
    });

    function toggleRegexSearch() {
        var dataTable = $('#table').DataTable();
        var useRegex = $('#regexCheckbox').prop('checked');

        // Set the search mode based on the checkbox state
        dataTable.search(dataTable.search(), useRegex, !useRegex).draw();
    }

</script>
{% endblock %}
